# 服务器配置部分
server:
  port: 8080 #端口号要根据前端request.js对应
# 日志配置部分
logging:
  level:
    root: info
# Spring框架配置部分
spring:
  profiles:
    #默认激活local，私密配置统一放 application-local.yaml（已被.gitignore排除，不要提交）
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Jackson日期格式化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss  # 日期格式
    time-zone: GMT+8  # 时区设置
  # Redis数据库配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}  # Redis服务器地址，实际地址在 application-local.yaml 覆盖
      port: ${REDIS_PORT:6379}  # Redis服务器端口
      password: ${REDIS_PASSWORD:}  # Redis密码，公网Redis务必开启requirepass
  # 数据源配置
  datasource:
    type: com.zaxxer.hikari.HikariDataSource  # 使用HikariCP作为数据源实现
    url: jdbc:mysql://${DB_HOST:localhost}:3306/exam_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8  # 数据库连接URL
    username: ${DB_USERNAME:root}  # 数据库用户名
    password: ${DB_PASSWORD:}  # 数据库密码，实际密码在 application-local.yaml 覆盖
    # Hikari连接池配置
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 #数据库连接超时时间,默认30秒
      idle-timeout: 500000 #空闲连接存活最大时间，默认600000（10分钟）
      max-lifetime: 540000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maximum-pool-size: 12 #连接池最大连接数，默认是10
      minimum-idle: 10 #最小空闲连接数量
      pool-name: SPHHikariPool # 连接池名称
  # 文件上传配置
  servlet:
    multipart:
      max-request-size: 150MB  # 最大请求大小
      max-file-size: 100MB  # 最大文件大小

# MyBatis-Plus配置
#用于打印框架生成的sql语句，便于调试（走slf4j，不再直接刷stdout）
mybatis-plus:
  configuration:
    # 配置日志实现类为slf4j实现
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 开启自动驼峰命名规则映射，即从数据库下划线命名到Java驼峰命名的自动转换
    auto-map-underscore-to-camel-case: true
    # 设置自动映射行为为full，表示自动映射所有非主键的列给JAVA对象的字段，在写mapper.xml文件时，可以省略resultMap标签的result属性,只写主键的属性
    auto-mapping-behavior: full

# minio的配置（账号密码在 application-local.yaml 覆盖）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  username: ${MINIO_USERNAME:}
  password: ${MINIO_PASSWORD:}
  bucket-name: exam0625

# AI 服务配置（OpenAI 兼容接口，默认接 DeepSeek）
# 换供应商只改这里，不需要动代码：
#   DeepSeek  : base-url=https://api.deepseek.com/chat/completions , model=deepseek-flash / deepseek-v4-pro
#   Kimi      : base-url=https://api.moonshot.cn/v1/chat/completions , model=kimi-k2.6
# api-key 放 application-local.yaml 或用环境变量 AI_API_KEY 注入，不要写在这里
ai:
  provider: ${AI_PROVIDER:deepseek}
  base-url: ${AI_BASE_URL:https://api.deepseek.com/chat/completions}
  model: ${AI_MODEL:deepseek-flash}
  api-key: ${AI_API_KEY:}
  max-tokens: 2048
  # DeepSeek 支持 0~2；Kimi k2 系列只接受 1。不确定时留空，交给服务端默认值
  temperature: ${AI_TEMPERATURE:1}
  timeout-seconds: 60

# JWT登录鉴权配置
jwt:
  secret: ${JWT_SECRET:exam-system-jwt-secret-key-2026-for-demo-only-please-change-in-production}
  expire: 604800000 #token有效期7天（毫秒）

# 接口文档：生产部署时通过环境变量 KNIFE4J_PRODUCTION=true 关闭文档页面
knife4j:
  production: ${KNIFE4J_PRODUCTION:false}

# 跨域白名单（集中配置在 WebConfig，生产同源部署时无需修改）
exam:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
